version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "nuget"
    directory: "/src/LaunchDarkly.Logging.Log4net"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "nuget"
    directory: "/test/LaunchDarkly.Logging.Log4net.Tests"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
